import("/designsystemet/assets/entry.client-DtiVOLdH.js");</script><!--$--><script>window.__reactRouterContext.streamController.enqueue("[{\"_1\":2,\"_3\":-5,\"_4\":-5},\"loaderData\",{\"_5\":6},\"actionData\",\"errors\",\"root\",{\"_7\":8},\"pageTree\",{\"_9\":10,\"_11\":12},\"$fumadocs_loader\",\"page-tree\",\"data\",{\"_13\":5,\"_14\":15,\"_16\":5,\"_17\":18,\"_19\":-7,\"_20\":21,\"_22\":23},\"type\",\"$ref\",{\"_36\":37,\"_38\":542},\"$id\",\"name\",\"Docs\",\"description\",\"children\",[39,40,41],\"fallback\",{\"_13\":5,\"_14\":24,\"_16\":25,\"_17\":18,\"_19\":-7,\"_20\":26},{\"_36\":37,\"_38\":-7},\"fallback:root\",[27],{\"_16\":28,\"_13\":29,\"_17\":30,\"_19\":31,\"_32\":-7,\"_33\":34,\"_14\":35},\"fallback:index.mdx\",\"page\",\"Designsystemet\",\"Dette er designsystemet til Skatteetaten. Her tilbyr vi komponenter og eksempler for at det skal være enkelt å lage gode digitale løsninger for brukerne våre.\",\"icon\",\"url\",\"/\",\"index.mdx\",\"folder\",\"\",\"meta\",{\"_13\":36,\"_17\":476,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":477,\"_16\":478,\"_14\":479,\"_32\":-7},{\"_13\":36,\"_17\":87,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":88,\"_16\":89,\"_14\":90,\"_32\":-7},{\"_13\":36,\"_17\":42,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":45,\"_16\":46,\"_14\":47,\"_32\":-7},\"Eksempler\",\"defaultOpen\",\"collapsible\",[48,49,50],\"eksempler\",{\"_36\":46,\"_38\":-7},{\"_13\":36,\"_17\":78,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":79,\"_16\":80,\"_14\":81,\"_32\":-7},{\"_13\":36,\"_17\":65,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":66,\"_16\":67,\"_14\":68,\"_32\":-7},{\"_13\":36,\"_17\":51,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":52,\"_16\":53,\"_14\":54,\"_32\":-7},\"Spørre bruker om\",[55,56],\"eksempler/spørre-bruker-om\",{\"_36\":53,\"_38\":-7},{\"_16\":61,\"_13\":29,\"_17\":62,\"_19\":63,\"_32\":-7,\"_33\":64,\"_14\":61},{\"_16\":57,\"_13\":29,\"_17\":58,\"_19\":59,\"_32\":-7,\"_33\":60,\"_14\":57},\"eksempler/spørre-bruker-om/mange-valg.mdx\",\"Å velge blant flere\",\"Tjenestene våre er fulle av valg som folk må ta. De kan ta ett valg, mange samtidig, på stor og liten plass og i ulike sammenhenger. Denne siden inneholder anbefalinger og eksempler på denne type valg.\",\"/eksempler/sp%C3%B8rre-bruker-om/mange-valg\",\"eksempler/spørre-bruker-om/datoer.mdx\",\"Datoer og klokkeslett\",\"Her viser vi eksempler på registrering av datoer og klokkeslett i ulike situasjoner.\",\"/eksempler/sp%C3%B8rre-bruker-om/datoer\",\"Sidetyper\",[69,70],\"eksempler/sidetyper\",{\"_36\":67,\"_38\":-7},{\"_16\":74,\"_13\":29,\"_17\":75,\"_19\":76,\"_32\":-7,\"_33\":77,\"_14\":74},{\"_16\":71,\"_13\":29,\"_17\":72,\"_19\":-7,\"_32\":-7,\"_33\":73,\"_14\":71},\"eksempler/sidetyper/intern.mdx\",\"Intern\",\"/eksempler/sidetyper/intern\",\"eksempler/sidetyper/ekstern.mdx\",\"Sideoppsett for publikum\",\"Her viser vi hvordan du bygger opp en publikumsløsning i Skatteetaten. Du lærer om layout, innholdsplassering og containere.\",\"/eksempler/sidetyper/ekstern\",\"Hjelpe bruker med\",[82],\"eksempler/hjelpe-bruker-med\",{\"_36\":80,\"_38\":-7},{\"_16\":83,\"_13\":29,\"_17\":84,\"_19\":85,\"_32\":-7,\"_33\":86,\"_14\":83},\"eksempler/hjelpe-bruker-med/bytte-representasjon.mdx\",\"Rollebytte og representasjon\",\"Denne eksempelsiden viser hvordan publikumsløsninger kan løse valg, visning og bytte av representasjon ved hjelp av komponentene i designsystemet. Målet er å skape en konsistent opplevelse på tvers av tjenester, redusere behovet for lokale tolkninger og gjøre det enklere å lage gode løsninger med ferdige komponenter.\",\"/eksempler/hjelpe-bruker-med/bytte-representasjon\",\"Byggeklosser\",[92,93,94,95],\"byggeklosser\",{\"_36\":89,\"_38\":91},\"byggeklosser/meta.json\",{\"_13\":36,\"_17\":444,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":445,\"_16\":446,\"_14\":447,\"_32\":-7},{\"_13\":36,\"_17\":144,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":145,\"_16\":146,\"_14\":147, ":297,\"_33\":298,\"_14\":294},{\"_16\":289,\"_13\":29,\"_17\":290,\"_19\":291,\"_32\":292,\"_33\":293,\"_14\":289},{\"_16\":284,\"_13\":29,\"_17\":285,\"_19\":286,\"_32\":287,\"_33\":288,\"_14\":284},{\"_16\":279,\"_13\":29,\"_17\":280,\"_19\":281,\"_32\":282,\"_33\":283,\"_14\":279},{\"_16\":274,\"_13\":29,\"_17\":275,\"_19\":276,\"_32\":277,\"_33\":278,\"_14\":274},{\"_16\":270,\"_13\":29,\"_17\":271,\"_19\":272,\"_32\":-7,\"_33\":273,\"_14\":270},{\"_16\":265,\"_13\":29,\"_17\":266,\"_19\":267,\"_32\":268,\"_33\":269,\"_14\":265},{\"_16\":260,\"_13\":29,\"_17\":261,\"_19\":262,\"_32\":263,\"_33\":264,\"_14\":260},{\"_16\":255,\"_13\":29,\"_17\":256,\"_19\":257,\"_32\":258,\"_33\":259,\"_14\":255},{\"_16\":250,\"_13\":29,\"_17\":251,\"_19\":252,\"_32\":253,\"_33\":254,\"_14\":250},{\"_16\":245,\"_13\":29,\"_17\":246,\"_19\":247,\"_32\":248,\"_33\":249,\"_14\":245},{\"_16\":240,\"_13\":29,\"_17\":241,\"_19\":242,\"_32\":243,\"_33\":244,\"_14\":240},{\"_16\":235,\"_13\":29,\"_17\":236,\"_19\":237,\"_32\":238,\"_33\":239,\"_14\":235},{\"_16\":230,\"_13\":29,\"_17\":231,\"_19\":232,\"_32\":233,\"_33\":234,\"_14\":230},{\"_16\":225,\"_13\":29,\"_17\":226,\"_19\":227,\"_32\":228,\"_33\":229,\"_14\":225},{\"_16\":220,\"_13\":29,\"_17\":221,\"_19\":222,\"_32\":223,\"_33\":224,\"_14\":220},{\"_16\":215,\"_13\":29,\"_17\":216,\"_19\":217,\"_32\":218,\"_33\":219,\"_14\":215},{\"_16\":210,\"_13\":29,\"_17\":211,\"_19\":212,\"_32\":213,\"_33\":214,\"_14\":210},{\"_16\":205,\"_13\":29,\"_17\":206,\"_19\":207,\"_32\":208,\"_33\":209,\"_14\":205},{\"_16\":200,\"_13\":29,\"_17\":201,\"_19\":202,\"_32\":203,\"_33\":204,\"_14\":200},\"byggeklosser/komponenter/wordinfo.mdx\",\"WordInfo\",\"WordInfo brukes til å forklare ord og uttrykk direkte i løpende tekst. Komponenten gjør det mulig å gi forklaringer uten at brukeren trenger å navigere bort fra konteksten. Den senker terskelen for å forstå fagbegreper og øker leseflyt og tilgjengelighet.\",\"/illustrations/wordinfo.svg\",\"/byggeklosser/komponenter/wordinfo\",\"byggeklosser/komponenter/topbannerinternal.mdx\",\"TopBannerInternal\",\"TopBannerInternal brukes som toppbanner i interne løsninger for Skatteetatens ansatte, eksempelvis saksbehandling eller administrasjonssystemer. Den gir et tydelig og konsistent utgangspunkt for intern navigasjon, identifikasjon av bruker og løsning, og plassering av overordnede funksjoner.\",\"/illustrations/topbannerinternal.svg\",\"/byggeklosser/komponenter/topbannerinternal\",\"byggeklosser/komponenter/topbannerexternal.mdx\",\"TopBannerExternal\",\"TopBannerExternal brukes som toppbanner i alle publikumsløsninger. Den gir brukeren tilgang til sentrale funksjoner som innlogging, meny, søk, språkvalg, representasjonsbytte og varsler. Formålet er å sikre en gjenkjennbar, effektiv og konsistent navigasjonsopplevelse på tvers av tjenester.\",\"/illustrations/topbannerexternal.svg\",\"/byggeklosser/komponenter/topbannerexternal\",\"byggeklosser/komponenter/textfield.mdx\",\"TextField\",\"TextField brukes når brukeren skal skrive inn korte tekster eller tall. Det er et fleksibelt felt som fungerer godt i skjemaer der informasjonen ikke passer inn i forhåndsdefinerte valg, og hvor fritekst eller tall svarer best på behovet.\",\"/illustrations/textfield.svg\",\"/byggeklosser/komponenter/textfield\",\"byggeklosser/komponenter/textarea.mdx\",\"TextArea\",\"TextArea brukes når brukeren skal fylle inn fritekst som går over flere linjer. Det er et fleksibelt tekstfelt som egner seg for åpne svar, beskrivelser, forklaringer og informasjon som ikke lar seg begrense til én linje.\",\"/illustrations/textarea.svg\",\"/byggeklosser/komponenter/textarea\",\"byggeklosser/komponenter/tag.mdx\",\"Tag\",\"Tag brukes til å markere eller utheve informasjon i en liten, farget boks med kort tekst inni. Den gjør det enklere for brukeren å raskt oppfatte status, kategori eller annen nøkkelinfo.\",\"/illustrations/tag.svg\",\"/byggeklosser/komponenter/tag\",\"byggeklosser/komponenter/tabs.mdx\",\"Tabs\",\"Tabs (arkfaner) brukes for å dele innhold i ulike områder eller seksjoner innenfor samme kontekst. De gjør det enklere for brukeren å skanne informasjon, orientere seg og veksle mellom innhold uten å navigere bort fra siden.\",\"/illustrations/tabs.svg\",\"/byggeklosser/komponenter/tabs\",\"byggeklosser/komponenter/table.mdx\",\"Table\",\"Table brukes for å organisere og presentere data på en strukturert måte i rekker og kolonner. Tabellen gjør det enkelt å sammenligne data og gir brukeren oversikt når informasjonen naturlig hører sammen i et tabellformat.\",\"/illustrations/table.svg\",\"/byggeklosser/komponenter/table\",\"byggeklosser/komponenter/steplist.mdx\",\"StepList\",\"StepList brukes når brukeren skal veiledes gjennom en serie steg, typisk i et skjema eller en veiviser. Den gjør det enklere for brukeren å fullføre oppgaver gjennom tydelig struktur, forutsigbarhet og god fremdriftsforståelse.\",\"/illustrations/steplist.svg\",\"/byggeklosser/komponenter/steplist\",\"byggeklosser/komponenter/spinner.mdx\",\"Spinner\",\"Spinner brukes som en visuell indikasjon på at systemet jobber. Den signaliserer at noe er i ferd med å lastes inn, og at brukeren må vente et lite øyeblikk før informasjon eller funksjonalitet blir tilgjengelig.\",\"/illustrations/spinner.svg\",\"/byggeklosser/komponenter/spinner\",\"byggeklosser/komponenter/select.mdx\",\"Select\",\"Select brukes når brukeren skal velge ett alternativ fra en liste med mange valg. Den er spesielt nyttig når tilgjengelig plass er begrenset, og når radioknapper ville blitt for omfattende.\",\"/illustrations/select.svg\",\"/byggeklosser/komponenter/select\",\"byggeklosser/komponenter/searchfield.mdx\",\"SearchField\",\"SearchField brukes når brukeren skal søke seg fram til et resultat i løsningen. Det gir rask tilgang til relevant informasjon ved at brukeren kan skrive inn et søk og gå til trefflisten eller et konkret søkeresultat.\",\"/illustrations/searchfield.svg\",\"/byggeklosser/komponenter/searchfield\",\"byggeklosser/komponenter/scrolltotopbutton.mdx\",\"ScrollToTopButton\",\"ScrollToTopButton brukes for å gjøre det raskere og enklere for brukeren å navigere tilbake til toppen av siden etter å ha scrollet langt ned. Den forbedrer brukeropplevelsen på sider med mye innhold og reduserer behovet for omfattende manuell scrolling.\",\"/illustrations/scrolltotopbutton.svg\",\"/byggeklosser/komponenter/scrolltotopbutton\",\"byggeklosser/komponenter/rolepicker.mdx\",\"RolePicker\",\"RolePicker brukes i innloggede publikumstjenester når brukeren skal velge hvem de representerer — privatperson, virksomhet eller verge for andre. Komponenten sikrer at brukeren starter tjenesten i riktig rolle og skaper trygghet rundt hvilket ansvar og hvilke data som tilhører valgt representasjon.\",\"/illustrations/rolepicker.svg\",\"/byggeklosser/komponenter/rolepicker\",\"byggeklosser/komponenter/rolebanner.mdx\",\"RoleBanner\",\"RoleBanner brukes i innloggede løsninger for å vise brukeren hvem de representerer (seg selv eller andre) og gi kontekst for handlinger de utfører på vegne av denne rollen.\",\"/byggeklosser/komponenter/rolebanner\",\"byggeklosser/komponenter/radiogroup.mdx\",\"RadioGroup\",\"RadioGroup brukes når brukeren skal velge kun ett alternativ blant et lite antall valg. Den gjør det enkelt å vurdere og sammenligne alternativer på en strukturert måte.\",\"/illustrations/radiogroup.svg\",\"/byggeklosser/komponenter/radiogroup\",\"byggeklosser/komponenter/popover.mdx\",\"Popover\",\"Popover brukes til å vise korte forklaringer eller utfyllende informasjon i et lite overliggende felt uten å ta brukeren bort fra det opprinnelige innholdet. Den gir brukeren nødvendig kontekst uten å forstyrre flyten.\",\"/illustrations/popover.svg\",\"/byggeklosser/komponenter/popover\",\"byggeklosser/komponenter/paragraph.mdx\",\"Paragraph\",\"Paragraph brukes til å presentere løpende tekst i to varianter; ingress eller vanlig brødtekst. Komponentens typografi sikrer lesbarhet og god struktur.\",\"/illustrations/paragraph.svg\",\"/byggeklosser/komponenter/paragraph\",\"byggeklosser/komponenter/panel.mdx\",\"Panel\",\"Panel brukes til å ramme inn og fremheve informasjon eller oppgaver som hører sammen. Det gjør at viktig eller relatert innhold skiller seg tydelig fra resten av siden, uten at det dominerer helhetsopplevelsen.\",\"/illustrations/panel.svg\",\"/byggeklosser/komponenter/panel\",\"byggeklosser/komponenter/pagination.mdx\",\"Pagination\",\"Pagination brukes til å dele opp store mengder innhold i flere sider slik at brukeren ikke blir overveldet. Den gjør det enklere å navigere frem og tilbake i informasjon som tabeller, søkeresultater eller lister.\",\"/illustrations/pagination.svg\",\"/byggeklosser/komponenter/pagination\",\"byggeklosser/komponenter/openclose.mdx\",\"OpenClose\",\"OpenClose brukes til å vise og skjule utdypende informasjon slik at siden blir enklere å skanne. Kun brukere som trenger detaljene åpner dem, mens andre kan hoppe videre uten visuell støy.\",\"/illustrations/openclose.svg\",\"/byggeklosser/komponenter/openclose\",\"byggeklosser/komponenter/navigationtile.mdx\",\"NavigationTile\",\"NavigationTile brukes til å presentere ett eller flere navigasjonsvalg som visuelt tydelige fliser. Dette gjør det enkelt for brukerne å forstå hvilke hovedvalg de har, og gir en oversiktlig inngang til nye områder eller innhold.\",\"/illustrations/navigationtile.svg\",\"/byggeklosser/komponenter/navigationtile\",\"byggeklosser/komponenter/modal.mdx\",\"Modal\",\"Modal brukes for å styre brukerens fokus ved å vise et opphøyd innholdsvindu mens resten av siden tones ned. Den hjelper brukeren å forstå hva som skjer videre i løsningen og sikrer at viktig informasjon ikke overses.\",\"/illustrations/modal.svg\",\"/byggeklosser/komponenter/modal\",\"byggeklosser/komponenter/megabutton.mdx\",\"MegaButton\",\"MegaButton brukes til tydelige hovedhandlinger som enten står alene på en side eller tar brukeren videre til et nytt område. Den skal skape sterk visuell oppmerksomhet og indikere ett klart primært valg.\",\"/illustrations/megabutton.svg\",\"/byggeklosser/komponenter/megabutton\",\"byggeklosser/komponenter/list.mdx\",\"List\",\"List brukes for å presentere innhold i punkt- eller nummererte lister. Lister gjør informasjon lettere å skanne, særlig ved opplisting av steg, eksempler eller elementer.\",\"/illustrations/list.svg\",\"/byggeklosser/komponenter/list\",\"byggeklosser/komponenter/linkgroup.mdx\",\"LinkGroup\",\"LinkGroup brukes til å vise en liste med navigasjonslenker som enten leder til eksterne sider eller til seksjoner på samme side. Den gir brukeren et tydelig, strukturert sett med valg med piler som viser retningen.\",\"/illustrations/linkgroup.svg\",\"/byggeklosser/komponenter/linkgroup\",\"byggeklosser/komponenter/link.mdx\",\"Link\",\"Link brukes for å navigere brukeren til filer, interne sider, eksterne sider eller andre steder på samme side. Den skal kommunisere tydelig hva som skjer når brukeren klikker.\",\"/illustrations/link.svg\",\"/byggeklosser/komponenter/link\",\"byggeklosser/komponenter/inlinebutton.mdx\",\"InlineButton\",\"InlineButton brukes til selvstendige, mindre fremtredende handlinger i skjema, tabeller eller andre flater der en vanlig Button blir for dominerende. Den gir en mer plasseringsvennlig måte å presentere handlinger som «Legg til» eller «Fjern».\",\"/illustrations/inlinebutton.svg\",\"/byggeklosser/komponenter/inlinebutton\",\"byggeklosser/komponenter/iconbutton.mdx\",\"IconButton\",\"IconButton brukes til mindre fremtredende handlinger, særlig der det er lite plass, eller der funksjonen er så innlysende at den ikke trenger tekstlig forklaring. Den gir en effektiv og kompakt måte å utføre handlinger på.\",\"/illustrations/iconbutton.svg\",\"/byggeklosser/komponenter/iconbutton\",\"byggeklosser/komponenter/icon.mdx\",\"Icon\",\"Icon brukes for å spare plass, forenkle navigasjon og gi visuell støtte til tekstlig innhold. Ikoner skal hjelpe brukeren å oppfatte funksjon, handling eller tema raskere enn ren tekst alene.\",\"/illustrations/icon.svg\",\"/byggeklosser/komponenter/icon\",\"byggeklosser/komponenter/heading.mdx\",\"Heading\",\"Heading brukes for å strukturere innhold og gi tydelige nivåer av overskrifter. Komponentens typografi følger Skatteetatens visuelle profil, og sikrer korrekt semantikk og god tilgjengelighet.\",\"/illustrations/heading.svg\",\"/byggeklosser/komponenter/heading\",\"byggeklosser/komponenter/footer.mdx\",\"Footer\",\"Footer brukes i publikumsløsninger for å markere bunnen av siden og gi brukeren tilgang til felles, overordnede lenker som gjelder på tvers av Skatteetatens tjenester. Den bidrar til gjenkjennelighet, sammenheng og enhetlig opplevelse.\",\"/illustrations/footer.svg\",\"/byggeklosser/komponenter/footer\",\"byggeklosser/komponenter/fileuploader.mdx\",\"FileUploader\",\"FileUploader brukes når brukeren skal laste opp ett eller flere vedlegg fra egen enhet. Den støtter både filvelger og dra‑og‑slipp, og kan håndtere bilder og andre filtyper.\",\"/illustrations/fileuploader.svg\",\"/byggeklosser/komponenter/fileuploader\",\"byggeklosser/komponenter/fieldset.mdx\",\"Fieldset\",\"Fieldset brukes til å gruppere relaterte skjemafelt og gi dem en felles ledetekst.\",\"/illustrations/fieldset.svg\",\"/byggeklosser/komponenter/fieldset\",\"byggeklosser/komponenter/errorsummary.mdx\",\"ErrorSummary\",\"ErrorSummary brukes til å vise en samlet oversikt over to eller flere feil i et skjema eller en stegliste. Den hjelper brukeren å forstå hva som må rettes før hen kan gå videre, og gir mulighet til å hoppe direkte til feltene med feil.\",\"/illustrations/errorsummary.svg\",\"/byggeklosser/komponenter/errorsummary\",\"byggeklosser/komponenter/errormessage.mdx\",\"ErrorMessage\",\"ErrorMessage brukes til å vise feil som brukeren må rette for å komme videre, for eksempel i utfyllingen av et skjema. Den gir tydelig og kontekstuell feilmelding knyttet til et spesifikt felt eller område.\",\"/illustrations/errormessage.svg\",\"/byggeklosser/komponenter/errormessage\",\"byggeklosser/komponenter/divider.mdx\",\"Divider\",\"Divider (delelinje) brukes til å visuelt skille innhold fra hverandre. Det markerer et tematisk skille mellom seksjoner og bidrar til bedre struktur og lesbarhet.\",\"/illustrations/divider.svg\",\"/byggeklosser/komponenter/divider\",\"byggeklosser/komponenter/descriptionlist.mdx\",\"DescriptionList\",\"DescriptionList brukes til å vise en gruppe verdier med tilhørende ledetekster. Den gjør det enklere å presentere ikke‑interaktive opplysninger på en strukturert og lett skannbar måte.\",\"/illustrations/descriptionlist.svg\",\"/byggeklosser/komponenter/descriptionlist\",\"byggeklosser/komponenter/datepicker.mdx\",\"DatePicker\",\"DatePicker gjør det enklere for brukeren å oppgi riktig dato, særlig når datoen ligger nær i tid eller når det er nyttig å kunne se ukedager i valgprosessen.\",\"/illustrations/datepicker.svg\",\"/byggeklosser/komponenter/datepicker\",\"byggeklosser/komponenter/combobox.mdx\",\"Combobox\",\"Combobox lar brukeren velge ett eller flere alternativer fra en liste. Den kombinerer funksjonaliteten til en nedtrekksliste og et tekstfelt, slik at brukeren kan skrive for å filtrere valgene.\",\"/illustrations/combobox.svg\",\"/byggeklosser/komponenter/combobox\",\"byggeklosser/komponenter/chips.mdx\",\"Chips\",\"Chips er små interaktive komponenter som brukes til å styre visning av innhold, ofte i forbindelse med filtrering, valg eller visning av status i en gruppe.\",\"/illustrations/chips.svg\",\"/byggeklosser/komponenter/chips\",\"byggeklosser/komponenter/checkboxgroup.mdx\",\"CheckboxGroup\",\"CheckboxGroup brukes når brukeren kan velge ett eller flere alternativer. Hver avkrysning er uavhengig av de andre, og det er også et gyldig valg å ikke velge noen.\",\"/illustrations/checkboxgroup.svg\",\"/byggeklosser/komponenter/checkboxgroup\",\"byggeklosser/komponenter/checkbox.mdx\",\"Checkbox\",\"Checkbox (avkrysningsboks) brukes for å ta stilling til ett enkeltstående valg, typisk som en bekreftelse på at innhold er lest eller forstått.\",\"/illustrations/checkbox.svg\",\"/byggeklosser/komponenter/checkbox\",\"byggeklosser/komponenter/card.mdx\",\"Card\",\"Card (kort) brukes til å gruppere innhold av samme type. Komponenten kan inneholde knapper, tekst, grafikk, ikoner og andre elementer for å presentere informasjon og handlinger på en strukturert og lettfattelig måte.\",\"/illustrations/card.svg\",\"/byggeklosser/komponenter/card\",\"byggeklosser/komponenter/button.mdx\",\"Button\",\"Button (knapp) brukes til viktige handlinger på siden, for eksempel i knapperader i bunnen av skjema eller i dialogbokser. Knappen skal gjøre det tydelig for brukeren hvilken handling som er mest sentral i situasjonen.\",\"/illustrations/button.svg\",\"/byggeklosser/komponenter/button\",\"byggeklosser/komponenter/breadcrumbs.mdx\",\"Breadcrumbs\",\"Breadcrumbs (brødsmulesti) viser brukeren hvor de befinner seg i nettstedets hierarki og gjør det enkelt å navigere tilbake til høyere nivåer i strukturen.\",\"/illustrations/breadcrumbs.svg\",\"/byggeklosser/komponenter/breadcrumbs\",\"byggeklosser/komponenter/blockquote.mdx\",\"Blockquote\",\"Blockquote brukes når du skal presentere et sitat eller utdrag på en tydelig og visuelt markert måte, med et lite innrykk og vertikal linje langs venstre marg.\",\"/illustrations/blockquote.svg\",\"/byggeklosser/komponenter/blockquote\",\"byggeklosser/komponenter/alert.mdx\",\"Alert\",\"Alert (varsel) brukes til å gi brukeren en aktuell statusbeskjed om en viktig hendelse eller konsekvenser av en handling. Formålet er å hjelpe brukeren med å løse oppgaven sin og gi trygghet slik at de opplever kontroll over situasjonen.\",\"/illustrations/alert.svg\",\"/byggeklosser/komponenter/alert\",\"byggeklosser/komponenter/accordion.mdx\",\"Accordion\",\"Accordion brukes for å komprimere innhold på siden slik at brukeren lettere får oversikt og kan navigere direkte til det innholdet som er relevant. Den består av seksjoner som kan åpnes og lukkes uavhengig av hverandre.\",\"/illustrations/accordion.svg\",\"/byggeklosser/komponenter/accordion\",\"Designtokens\",[449,450,451,452,453,454],\"byggeklosser/designtokens\",{\"_36\":446,\"_38\":448},\"byggeklosser/designtokens/meta.json\",{\"_16\":472,\"_13\":29,\"_17\":473,\"_19\":474,\"_32\":-7,\"_33\":475,\"_14\":472},{\"_16\":469,\"_13\":29,\"_17\":470,\"_19\":-7,\"_32\":-7,\"_33\":471,\"_14\":469},{\"_16\":466,\"_13\":29,\"_17\":467,\"_19\":-7,\"_32\":-7,\"_33\":468,\"_14\":466},{\"_16\":462,\"_13\":29,\"_17\":463,\"_19\":464,\"_32\":-7,\"_33\":465,\"_14\":462},{\"_16\":459,\"_13\":29,\"_17\":460,\"_19\":-7,\"_32\":-7,\"_33\":461,\"_14\":459},{\"_16\":455,\"_13\":29,\"_17\":456,\"_19\":457,\"_32\":-7,\"_33\":458,\"_14\":455},\"byggeklosser/designtokens/avstander.mdx\",\"Avstander\",\"Avstander som brukes til marginer, padding og gap.\",\"/byggeklosser/designtokens/avstander\",\"byggeklosser/designtokens/storrelser.mdx\",\"Størrelser\",\"/byggeklosser/designtokens/storrelser\",\"byggeklosser/designtokens/farger.mdx\",\"Farger\",\"Fargepaletten vår består av et sett basefarger, og et sett semantiske farger. De semantiske fargene viser til navngitte bruksområder (f.eks. en knapp som trykkes på, eller en status) eller flatene de settes på (f.eks. bakgrunn eller kantlinjer).\",\"/byggeklosser/designtokens/farger\",\"byggeklosser/designtokens/font.mdx\",\"Font\",\"/byggeklosser/designtokens/font\",\"byggeklosser/designtokens/containere.mdx\",\"Containere\",\"/byggeklosser/designtokens/containere\",\"byggeklosser/designtokens/brekkpunkter.mdx\",\"Brekkpunkter\",\"Vi støtter skjermer fra 320px og oppover.\",\"/byggeklosser/designtokens/brekkpunkter\",\"Guider\",[481,482,483,484,485,486],\"guider\",{\"_36\":478,\"_38\":480},\"guider/meta.json\",{\"_16\":538,\"_13\":29,\"_17\":539,\"_19\":540,\"_32\":-7,\"_33\":541,\"_14\":538},{\"_13\":36,\"_17\":518,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":519,\"_16\":520,\"_14\":521,\"_32\":-7},{\"_13\":36,\"_17\":504,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":505,\"_16\":506,\"_14\":507,\"_32\":-7},{\"_16\":500,\"_13\":29,\"_17\":501,\"_19\":502,\"_32\":-7,\"_33\":503,\"_14\":500},{\"_13\":36,\"_17\":491,\"_5\":-7,\"_43\":-7,\"_19\":-7,\"_44\":-7,\"_20\":492,\"_16\":493,\"_14\":494,\"_32\":-7},{\"_16\":487,\"_13\":29,\"_17\":488,\"_19\":489,\"_32\":-7,\"_33\":490,\"_14\":487},\"guider/endringslogg.mdx\",\"Endringslogg\",\"Historikk over viktige endringer i designsystemet. Den nyeste versjonen vises først.\",\"/guider/endringslogg\",\"Migrering\",[495],\"guider/migrering\",{\"_36\":493,\"_38\":-7},{\"_16\":496,\"_13\":29,\"_17\":497,\"_19\":498,\"_32\":-7,\"_33\":499,\"_14\":496},\"guider/migrering/versjon_3.mdx\",\"Migreringsguide for versjon 3.0\",\"Denne versjonen inneholder enkelte brytende endringer og oppryddinger i API-et. De fleste endringene kan håndteres med enkle søk-og-erstatt-operasjoner, mens noen få krever manuell oppfølging.\",\"/guider/migrering/versjon_3\",\"guider/nettleserstotte.mdx\",\"Nettlesere\",\"Designsystemet er utviklet for moderne nettlesere på mobil, nettbrett og PC. Komponentene bygger på etablerte webstandarder og er testet for å fungere på tvers av de mest brukte nettleserne blant brukere av Skatteetatens tjenester. På denne siden finner du informasjon om hvilke nettlesere vi tester med, hvilke nettlesere vi forventer skal fungere, og hvilke som ikke støttes.\",\"/guider/nettleserstotte\",\"Kom i gang\",[508,509],\"guider/kom-i-gang\",{\"_36\":506,\"_38\":-7},{\"_16\":514,\"_13\":29,\"_17\":515,\"_19\":516,\"_32\":-7,\"_33\":517,\"_14\":514},{\"_16\":510,\"_13\":29,\"_17\":511,\"_19\":512,\"_32\":-7,\"_33\":513,\"_14\":510},\"guider/kom-i-gang/for-utviklere.mdx\",\"For utviklere\",\"Som utvikler samarbeider du med designer for å best mulig sikre at dere følger prinsippene i designsystemet. Videre ser du hvordan du kommer i gang for å bruke designsystemet når du jobber.\",\"/guider/kom-i-gang/for-utviklere\",\"guider/kom-i-gang/for-designere.mdx\",\"For designere\",\"Som designer samarbeider du med utviklerne i prosjektet ditt for å best mulig følge prinsippene i designsystemet. Videre ser du hvordan du kommer i gang for å bruke designsystemet når du jobber.\",\"/guider/kom-i-gang/for-designere\",\"Styling\",[523,524,525],\"guider/styling\",{\"_36\":520,\"_38\":522},\"guider/styling/meta.json\",{\"_16\":534,\"_13\":29,\"_17\":535,\"_19\":536,\"_32\":-7,\"_33\":537,\"_14\":534},{\"_16\":530,\"_13\":29,\"_17\":531,\"_19\":532,\"_32\":-7,\"_33\":533,\"_14\":530},{\"_16\":526,\"_13\":29,\"_17\":527,\"_19\":528,\"_32\":-7,\"_33\":529,\"_14\":526},\"guider/styling/mixins.mdx\",\"Mixins (SCSS)\",\"Designsystemet tilbyr noen få hjelpestiler som kan brukes når du bygger egne komponenter eller trenger funksjonalitet som går igjen på tvers av løsninger. Hjelpestilene leveres som SCSS-mixins og kan importeres ved behov.\",\"/guider/styling/mixins\",\"guider/styling/tilpasse-komponenter.mdx\",\"Tilpasse komponenter\",\"Designsystemet er laget for å dekke de fleste behov uten tilpasninger. Komponentene har standardverdier som bidrar til helhetlige brukeropplevelser, god tilgjengelighet og lik oppførsel på tvers av løsninger. Når du trenger å gjøre tilpasninger anbefaler vi å følge denne rekkefølgen.\",\"/guider/styling/tilpasse-komponenter\",\"guider/styling/bruke-tokens.mdx\",\"Bruke designtokens\",\"Designtokens er de minste byggeklossene i designsystemet. De representerer designvalg som farger, avstander, typografi og størrelser, og brukes på tvers av Figma, CSS og komponentbiblioteket.\",\"/guider/styling/bruke-tokens\",\"guider/introduksjon.mdx\",\"Introduksjon\",\"Velkommen til designsystemet. Her får du vite hva designsystemet er, hvorfor det finnes, og hvordan du kan få hjelp fra eller samarbeide med oss i designsystemteamet.\",\"/guider/introduksjon\",\"meta.json\"]\n");</script><!--$--><script>window.__reactRouterContext.streamController.close();</script><!--/$--><!--/$--></body></html>
